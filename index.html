<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title> </title>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<section class="hero">
  <img src="img/Fondo.jpg" alt="Baby Shower de Amaia" class="hero-img">

  <h1> </h1>
  <p>
   Escribe tu correo y elige hasta 3 regalitos de la lista ,luego presiona el boton "Confirmar Regalos"
  </p>
</section>

    <section class="form-card">
      <label for="email">Tu correo</label>
      <input 
        type="email" 
        id="email" 
        placeholder="ejemplo@correo.com" 
        autocomplete="email"
      />

      <p class="info">
        Puedes seleccionar máximo 3 regalos.
      </p>
    </section>

    <section>
      <h2>Sugerencia de Regalos</h2>
      <div id="giftList" class="gift-list">
        <p>Cargando regalos...</p>
      </div>
    </section>

    <button id="reserveBtn" class="reserve-btn">
      Confirmar regalos
    </button>

    <p id="message" class="message"></p>

    <section class="manage-card">
      <h2>¿Quieres cambiar o eliminar tus regalos?</h2>
      <p>
        Ingresa tu correo y revisa los regalos que ya reservaste.
      </p>

      <button id="myReservationsBtn" class="secondary-btn">
        Ver mis regalos reservados
      </button>

      <div id="myReservations" class="my-reservations"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
